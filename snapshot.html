 D.pool_full.map(r=>`<tr style="${r.eligible?'background:#f2fbf2':''}"><td class="code">${r.code}</td><td>${r.name}</td>
 <td><span class="score ${sc(+r.score)}">${r.score}</span></td><td>${r.board}</td><td class="mono">${r.close}</td>
 <td class="mono">${r.seal_time||'—'}</td><td>${r.turnover||'—'}</td><td>${r.fc||'—'}</td>
 <td>${r.fails?`<span style="color:#c62828">${r.fails}</span>`:'<span style="color:#2e7d32">通过</span>'}</td>
 <td style="font-size:12px;color:#888;white-space:normal;max-width:340px">${r.detail||''}</td></tr>`).join('') + '</table>';
}else{
 pool.innerHTML = `<div class="empty-state"><div class="icon">📈</div><div>${D.as_of} 涨停池评分数据缺失（运行 gen_pool.py 生成备选池后显示）</div></div>`;
}

tr.innerHTML = D.trades.length ? `<table><tr><th>代码</th><th>名称</th><th>买入日</th><th>买价</th><th>持有天数</th><th>盈亏</th><th>收益率</th><th>退出原因</th><th>信号日情绪</th></tr>` +
 D.trades.map(t=>`<tr><td class="code">${t.code}</td><td>${t.name}</td><td>${t.buy_date}</td><td class="mono">${t.buy_price}</td><td>${t.hold_days}</td>
 <td class="${t.pnl>=0?'profit':'loss'}">${t.pnl>=0?'+':''}${fmt(t.pnl)}</td><td class="${t.pnl>=0?'profit':'loss'}">${t.ret_pct}%</td><td>${t.last_reason}</td><td>${t.sentiment}家</td></tr>`).join('') + '</table>'
 : `<div class="empty-state"><div class="icon">📭</div><div>暂无交易记录</div></div>`;
const mt = document.getElementById('mtbl');
mt.innerHTML = D.monthly.length ? `<tr><th>月份</th>${D.monthly.map(m=>`<th>${m[0]}</th>`).join('')}</tr>
 <tr><td>收益率</td>${D.monthly.map(m=>`<td class="${m[1]>=0?'profit':'loss'}">${m[1]>=0?'+':''}${m[1]}%</td>`).join('')}</tr>` : '';
function draw(){
 const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
 const w = cv.width = cv.offsetWidth * 2, h = cv.height = 600;
 ctx.clearRect(0,0,w,h);
 const C = JSON.parse(D.curve);
 if(C.length < 2) return;
 const vs = C.map(c=>c[1]), mn = Math.min(...vs)*.995, mx = Math.max(...vs)*1.005;
 const X = i=>70+i*(w-110)/(C.length-1), Y = v=>h-50-(v-mn)*(h-90)/(mx-mn);
 ctx.strokeStyle='#eee';
 for(let f=0;f<=1;f+=.25){ctx.beginPath();ctx.moveTo(70,Y(mn+(mx-mn)*f));ctx.lineTo(w-40,Y(mn+(mx-mn)*f));ctx.stroke();}
 const grad = ctx.createLinearGradient(0,0,w,0); grad.addColorStop(0,'#6a11cb'); grad.addColorStop(1,'#2575fc');
 ctx.strokeStyle=grad; ctx.lineWidth=4; ctx.beginPath();
 C.forEach((c,i)=>i?ctx.lineTo(X(i),Y(c[1])):ctx.moveTo(X(i),Y(c[1]))); ctx.stroke();
 ctx.fillStyle='#888'; ctx.font='22px sans-serif';
 ctx.fillText(fmt(Math.round(mx)), 75, 34); ctx.fillText(fmt(Math.round(mn)), 75, h-24);
 ctx.fillText(C[0][0], 70, h-4); ctx.fillText(C[C.length-1][0], w-190, h-4);
}
document.getElementById('ft').innerHTML =
 `V3.3 规则：情绪正常档≥55家 ｜ 回撤预算6% ｜ 回落止盈6% ｜ 创业板止损=max(前收, 中点×0.92) ｜ 10日强清 ｜ 连亏3笔熔断 ｜ 单票25%×最多4只。` +
 `费用口径：佣金万2.5双边+印花万5卖出+滑点0.2%。红涨绿跌。本模拟盘仅供策略研究，不构成投资建议。`;
